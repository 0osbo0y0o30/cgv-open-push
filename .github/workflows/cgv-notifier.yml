name: CGV Notifier

on:
  schedule:
    # 매 10분마다 실행 (UTC 기준, GitHub 서버 사정에 따라 몇 분 정도 지연될 수 있음)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동으로도 실행 가능하게

permissions:
  contents: write  # state.json을 다시 커밋하려면 쓰기 권한 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        working-directory: v1
        run: pip install requests python-dotenv

      - name: 알리미 1회 실행
        working-directory: v1
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python run_check_once.py

      - name: 변경된 state.json 커밋
        working-directory: v1
        run: |
          git config user.name "cgv-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "상태 업데이트 [skip ci]"
          git push
